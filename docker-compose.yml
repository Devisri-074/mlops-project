services:
  # 1. FastAPI AI Prediction Microservice
  fastapi-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnwise-fastapi
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=./mlruns
    volumes:
      - ./models:/app/models
      - ./drift_reports:/app/drift_reports
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
      - ./streaming_churn_dataset.csv:/app/streaming_churn_dataset.csv
    restart: unless-stopped

  # 2. MLflow Experiment Tracking UI
  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churnwise-mlflow
    command: python launch_mlflow.py 8080 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    restart: unless-stopped

  # 3. Node.js Express REST API
  node-backend:
    image: node:18-alpine
    container_name: churnwise-node-api
    working_dir: /app/backend
    volumes:
      - .:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=churnwisepass
      - DB_NAME=churnwise_db
      - FASTAPI_URL=http://fastapi-predictor:8000
    depends_on:
      - mysql-db
    restart: unless-stopped

  # 4. MySQL 8 Database Store
  mysql-db:
    image: mysql:8.0
    container_name: churnwise-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: churnwisepass
      MYSQL_DATABASE: churnwise_db
    volumes:
      - ./churnwise_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
